name: Bug
description: A problem that is not a rule applied incorrectly
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Game client, Server, Console, Website, Simulations, AI, Card data, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context
      description: Browser, device, game ID, approximate time.
