name: CI

on:
  pull_request:
    # `edited` re-runs the checks when the PR title changes, so fixing a title that
    # commitlint rejected is enough. Both jobs run on every edit on purpose: skipping
    # `verify` would publish a "skipped" result that counts as passing for branch
    # protection, even if the previous run on the same commit had failed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  LEFTHOOK: 0

jobs:
  verify:
    name: Install, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency rules
        run: pnpm check:deps

      - name: Test
        run: pnpm test

      - name: Rule coverage
        run: pnpm test:rules

  bench:
    name: Engine benchmarks
    # Budgets (docs/03-rules-engine.md) are asserted by the benchmarks themselves. On a pull
    # request, the base branch is benchmarked on the same runner first, and a benchmark more
    # than 20% slower than on the base fails the job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Benchmark the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          if [ -f packages/spec/vitest.bench.config.ts ]; then
            pnpm install --frozen-lockfile
            # The base may miss a budget: its results are still a reference.
            pnpm bench --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/base.json" || true
          else
            echo "The base branch has no benchmarks yet."
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Benchmark and check the budgets
        run: pnpm bench --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/head.json"

      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        run: node scripts/compare-bench.ts "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check commit messages
        run: >
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
