name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      games:
        description: Number of fuzzed games
        default: "10000"

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  LEFTHOOK: 0

jobs:
  fuzz:
    name: Fuzz (long run)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A new seed every night: the same seed always plays the same games.
      - name: Fuzz
        env:
          GAMES: ${{ inputs.games || '10000' }}
          SEED: ${{ github.run_id }}
        run: pnpm fuzz --games "$GAMES" --seed "$((SEED % 2147483647))"

      - name: Upload the reproduction
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-repro-${{ github.run_id }}
          path: packages/testkit/repros/*-*.*
          if-no-files-found: ignore
